# Тип хранилища данных (SQLITE, MYSQL, YAML)
storage:
  type: SQLITE
  mysql:
    host: "localhost"
    port: 3306
    database: "glowcases"
    username: "root"
    password: ""
    table-prefix: "glowcases_"
    maximum-pool-size: 10
    minimum-idle: 2
    connection-timeout: 30000

# Визуальные 3D-эффекты и анимации в игровом мире
world-effects:
  # Режим анимации при клике по кейс-блоку:
  # WORLD - раскрутка 3D-анимацией в воздухе над кейсом как на HolyWorld (ПО УМОЛЧАНИЮ)
  # BOTH  - открывает GUI-рулетку + запускает 3D-шоу над блоком в мире для всех
  # GUI   - только классическое инвентарное меню
  mode: "WORLD"

  # Эффекты частиц во время прокрутки в воздухе
  particles:
    enabled: true
    # Спираль частиц вокруг блока (REDSTONE, FLAME, SPELL_WITCH, SOUL_FIRE_FLAME, END_ROD, etc.)
    spiral-particle: "REDSTONE"
    spiral-color: "#FB8C00"
    # Нижнее кольцо частиц
    rings-enabled: true
    ring-particle: "FLAME"

  # Празднование победы (финал прокрутки)
  celebration:
    # Сферический взрыв частиц (FIREWORKS_SPARK, TOTEM, VILLAGER_HAPPY)
    nova-enabled: true
    nova-particle: "FIREWORKS_SPARK"
    # Вертикальный столб частиц в небо
    pillar-enabled: true
    pillar-particle: "END_ROD"
    # Длительность показа победного 3D-предмета и голограммы в секундах
    display-duration-seconds: 5

  # Настройки праздничных салютов
  fireworks:
    enabled: true
    # Количество последовательных залпов
    burst-count: 3

# Настройки голограмм над блоками кейсов в покое
holograms:
  enabled: true
  offset-y: 1.6 # Высота над блоком
  floating-item:
    enabled: true
    offset-y: 0.8 # Высота парящего предмета
    rotate: true # Вращение предмета
  lines:
    - "%case_display_name%"
    - ""
    - "&7Нажмите &6&lПКМ&7, чтобы открыть"
    - "&7Нажмите &a&lЛКМ&7, чтобы посмотреть"

# Настройки анимации рулетки
roulette:
  title: "&#fb6b02&lК&#fb7a02&lЕ&#fb8902&lЙ&#fb9802&lС &#fba802&l» %case_display_name%"
  size: 27 # 27 или 45
  indicator-slot-top: 4
  indicator-slot-bottom: 22
  indicator-item:
    material: HOPPER
    name: "&#fb6b02&l▲ &#fbb602&lВЫИГРЫШ &#fb6b02&l▲"
    lore:
      - "&7Предмет по центру будет выдан вам!"
  background-item:
    material: BLACK_STAINED_GLASS_PANE
    name: " "
  # Длительность прокрутки в тиках (20 тиков = 1 секунда)
  total-ticks: 120
  # Звуки во время прокрутки
  tick-sound:
    sound: "BLOCK_NOTE_BLOCK_HAT"
    volume: 0.8
    pitch: 1.2
  win-sound:
    sound: "UI_TOAST_CHALLENGE_COMPLETE"
    volume: 1.0
    pitch: 1.0

