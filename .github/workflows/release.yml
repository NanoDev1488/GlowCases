name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release GlowCases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package --no-transfer-progress

      - name: Determine Version
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=v1.0.0" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.TAG_NAME }}
          name: GlowCases Release ${{ steps.get_version.outputs.TAG_NAME }}
          body: |
            ## GlowCases ✨ (HolyWorld Style Cases)
            
            ### 🌟 Что нового:
            - 🎰 Плавная CS:GO / Рулетка анимация замедления.
            - 🔮 Нативные 3D-голограммы и парящие вращающиеся предметы.
            - 📜 Меню предпросмотра наград и шансов.
            - 🗄 Поддержка SQLite, MySQL (HikariCP) и YAML.
            - 💎 Поддержка RGB/HEX цветов и градиентов.
            - 🎁 5 предустановленных кейсов (Донат, Руны, Спавнеры, Титулы, Валюта).
            - 🧩 Поддержка PlaceholderAPI и Vault.
            
            **Совместимость**: Spigot / Paper / Purpur 1.16.5 – 1.21.x
          draft: false
          prerelease: false
          files: target/GlowCases-*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
