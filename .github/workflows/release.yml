name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release GlowCases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package --no-transfer-progress

      - name: Determine Version
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=v1.1.0" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.TAG_NAME }}
          name: GlowCases Release ${{ steps.get_version.outputs.TAG_NAME }}
          body: |
            ## GlowCases v1.1.0 ✨ (HolyWorld / HolyCases Style)
            
            ### 🌟 Что нового в версии 1.1.0:
            - 🎆 **3D-раскрутка в воздухе над кейсом по умолчанию (HolyCases style)**:
              - 4 парящих орбитальных предмета и центральный предмет, вращающиеся по физической кривой.
              - Восходящая двойная DNA-спираль частиц и пламенные кольца вокруг блока.
              - Звуки вращения с нарастающим тоном (Pitch-Shift).
            - 🏆 **Победная 3D-голограмма и спецэффекты**:
              - Вспышка Nova Burst, столб света в небо (`End Rod`) и салют цвета редкости.
              - Парящая голограмма победителя с ником, названием предмета, редкостью и шансом на 5 секунд.
            - 🛡 **Защита от занятости блока**: невозможность повторного открытия одним блоком в один момент.
            - 🎰 Опциональные режимы `WORLD`, `BOTH`, `GUI` в `config.yml`.
            - 🗄 Поддержка SQLite, MySQL (HikariCP) и YAML.
            - 🧩 Поддержка PlaceholderAPI и Vault.
            
            **Совместимость**: Spigot / Paper / Purpur 1.16.5 – 1.21.x
          draft: false
          prerelease: false
          files: target/GlowCases-*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
